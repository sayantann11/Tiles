<title>TileDesk ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: desktop = fixed sidebar + scrolling workspace; phone = app bar + bottom tab bar + bottom sheets. Tile swatches with grout lines are the signature detail. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F5F7F6; --ink:#13201D; --muted:#5A6A65; --line:#DBE2DF;
  --accent:#0F6B5B; --accent-ink:#FFFFFF; --accent-soft:#DCEEE9;
  --clay:#A65E2A; --clay-soft:#F5E6D9;
  --good:#1C7C47; --good-soft:#DDF2E5; --warn:#9C6304; --warn-soft:#FAEDD2; --bad:#B23825; --bad-soft:#F8E0DA;
  --paper:#FFFFFF; --paper-ink:#1A1F1D; --paper-line:#E6E9E8;
  --grout:rgba(255,255,255,.78); --scrim:rgba(8,16,14,.52);
  --shadow:0 1px 2px rgba(16,32,28,.05),0 6px 20px rgba(16,32,28,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:14px; --side:252px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141D1A; --surface-2:#1A2521; --ink:#E4ECE9; --muted:#8FA19B; --line:#25322E;
  --accent:#3FB89D; --accent-ink:#05201A; --accent-soft:#163931; --clay:#E3A26C; --clay-soft:#3A2A1C;
  --good:#52C585; --good-soft:#13321F; --warn:#E8B24C; --warn-soft:#3A2C10; --bad:#F27D66; --bad-soft:#3E1D16;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141D1A; --surface-2:#1A2521; --ink:#E4ECE9; --muted:#8FA19B; --line:#25322E;
  --accent:#3FB89D; --accent-ink:#05201A; --accent-soft:#163931; --clay:#E3A26C; --clay-soft:#3A2A1C;
  --good:#52C585; --good-soft:#13321F; --warn:#E8B24C; --warn-soft:#3A2C10; --bad:#F27D66; --bad-soft:#3E1D16;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
body.locked{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance;font-weight:700;line-height:1.2}
h1{font-size:28px} h3{font-size:16px} h4{font-size:14px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.ic{flex:none;display:block}
.muted{color:var(--muted)}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:2px;padding:18px 14px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:6px;background:var(--accent);flex:none}
.logo i{background:var(--accent-ink);border-radius:2px;opacity:.92}
.logo i:nth-child(2),.logo i:nth-child(3){opacity:.42}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:12px;display:block}
.nav-l{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 10px 6px;font-weight:800}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:650;font-weight:600}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:800;background:var(--warn-soft);color:var(--warn);padding:1px 8px;border-radius:99px}
.side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side-foot small{color:var(--muted);display:block;font-size:12px;line-height:1.3}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1320px}
.top-title{font-family:var(--f-display);font-size:15px;font-weight:700;color:var(--muted)}
.top-brand{display:none;align-items:center;gap:10px;min-width:0}
.top-brand .logo{width:32px;height:32px;padding:5px;border-radius:9px}
.top-brand b{font-family:var(--f-display);font-size:16px}
.spacer{flex:1}
.view{display:flex;flex-direction:column;gap:18px;padding-block:6px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1320px;width:100%;min-width:0}
.bnav{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.wa{background:#1B9E4F;border-color:#1B9E4F;color:#FFFFFF}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.lg{height:48px;font-size:15px;padding:0 22px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;text-decoration:none}
.icon-btn.wa{color:#1B9E4F}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--clay-soft);color:var(--clay);flex:none;font-size:13px;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;line-height:1.6}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.clay{background:var(--clay-soft);color:var(--clay)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;opacity:.6;font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);flex:1;min-width:0;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%;color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* page head */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px;max-width:62ch}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--clay)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.flush{padding:4px 16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h a,.link{font-weight:700;font-size:13px;text-decoration:none;color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;cursor:pointer;color:var(--ink)}
.kpi small{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi .up{color:var(--good);font-weight:800}
.kpi .down{color:var(--bad);font-weight:800}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero small,.kpi.hero .sub{color:var(--accent-ink);opacity:.78}
.kpi.hero .up{color:var(--accent-ink)}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.strip>div{background:var(--surface);padding:12px 16px;min-width:0}
.strip small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.strip b{font-family:var(--f-display);font-size:20px;font-weight:700}
.strip b.warn{color:var(--warn)} .strip b.bad{color:var(--bad)} .strip b.good{color:var(--good)}

.alerts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--ink);min-width:0}
.alert .ab{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.alert .ab.warn{background:var(--warn-soft);color:var(--warn)} .alert .ab.bad{background:var(--bad-soft);color:var(--bad)} .alert .ab.acc{background:var(--accent-soft);color:var(--accent)} .alert .ab.clay{background:var(--clay-soft);color:var(--clay)}
.alert b{display:block;font-size:15px}
.alert span{font-size:12px;color:var(--muted);display:block;line-height:1.35}

/* chart */
.chart{display:flex;align-items:flex-end;gap:5px;height:170px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 41.5px,var(--line) 41.5px 42.5px)}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart .b{width:100%;max-width:30px;border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--accent) 78%,var(--surface));min-height:3px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.chart .col.today .b{background:var(--clay)}
.chart .col:hover .b{background:var(--accent)}
.xl{display:flex;gap:5px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);min-width:0}
.chart-note{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}

.hb{display:flex;flex-direction:column;gap:12px}
.hb-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hb-r .track{grid-column:2/4;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb-r .track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hb-r b{font-size:13.5px}
.hb-r .v{font-weight:800;font-size:13px;text-align:right}
.hb-r .sw{grid-row:1/3}

/* tile swatches */
.sw{width:64px;height:64px;border-radius:10px;flex:none;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);display:block}
.sw::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--grout),var(--grout)) 50% 0/1.5px 100% no-repeat,linear-gradient(var(--grout),var(--grout)) 0 50%/100% 1.5px no-repeat}
.sw.sm{width:40px;height:40px;border-radius:8px}
.sw.xs{width:30px;height:30px;border-radius:7px}
.sw.xl{width:100%;height:150px;border-radius:12px}

/* stock grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.pcard{display:flex;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;width:100%;color:var(--ink);min-width:0;transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:var(--shadow)}
.pc-b{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.pc-t{display:flex;align-items:center;gap:8px;min-width:0;justify-content:space-between}
.pc-t b{font-size:15px}
.meta{font-size:12.5px;color:var(--muted)}
.pc-n{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pc-n b{color:var(--ink);font-size:14px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.low i{background:var(--warn)} .bar.out i{background:var(--bad)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;min-width:0}
.rows>.row:first-child{border-top:0}
.row:hover{background:linear-gradient(90deg,transparent,var(--surface-2) 8%,var(--surface-2) 92%,transparent)}
.row .grow{flex:1;min-width:0}
.row b.t{font-size:14.5px}
.r-end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.amt{font-weight:800;font-size:14.5px}
.row-acts{display:flex;gap:6px;flex:none}

/* kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.kcol{scroll-snap-align:start;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:220px;min-width:0}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 6px 6px;font-weight:800;font-size:13.5px}
.kcol-h em{margin-left:auto;font-style:normal;color:var(--muted);font-weight:700;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.lcard:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.lcard p{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard .lf{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lcard .lb{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px}

/* ageing */
.age{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface-2)}
.age i{display:block;height:100%}
.age-l{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.age-l div{min-width:0}
.age-l small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:700}
.age-l b{font-size:16px;font-family:var(--f-display)}
.util{width:110px;flex:none}
.util small{font-size:11px;color:var(--muted);display:block;text-align:right;margin-top:3px}

/* sheets */
.layer{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.sheet-bg{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
.sheet{position:relative;background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:pop .22s ease-out;min-width:0}
.sheet.wide{width:min(880px,100%)}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:19px}
.sheet-h p{color:var(--muted);font-size:13px;margin-top:2px}
.sheet-b{padding:18px 20px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.sheet-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.grab{display:none}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

/* forms */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--surface-2);width:100%;min-width:0;color:var(--ink);outline:0}
.fld textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.frow3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.note{font-size:12.5px;padding:10px 12px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.good{background:var(--good-soft);color:var(--good)}
.note:empty{display:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.b-sec>h4{margin-bottom:10px}

/* builder */
.bitems{display:flex;flex-direction:column;gap:10px}
.bitem{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.bitem-h{display:flex;align-items:center;gap:12px;min-width:0}
.bitem-h .grow{flex:1;min-width:0}
.bitem-h small{color:var(--muted);font-size:12px}
.bitem-g{display:grid;grid-template-columns:1.5fr 1fr .8fr .9fr 1fr;gap:10px}
.bitem-g .batch{grid-column:1/-1}
.bitem-f{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:9px;padding:8px 12px;flex-wrap:wrap}
.bitem-f b{color:var(--ink);font-size:15px}

function creditOf(c){
  const debits=[];if(c.opening>0)debits.push({date:c.openingDate,amt:c.opening});
  DB.sales.forEach(s=>{if(s.cust.id===c.id){const due=s.total-s.paid;if(due>0)debits.push({date:s.date,amt:due})}});
  debits.sort((a,b)=>a.date<b.date?-1:1);
  const pays=DB.payments.filter(p=>p.cid===c.id);let pay=pays.reduce((a,p)=>a+p.amount,0);
  const open=[];for(const d of debits){if(pay>=d.amt){pay-=d.amt;continue}open.push({date:d.date,amt:d.amt-pay});pay=0}
  const out=open.reduce((a,d)=>a+d.amt,0)-pay;const b=[0,0,0,0];
  open.forEach(d=>{const n=daysSince(d.date);b[n<=30?0:n<=60?1:n<=90?2:3]+=d.amt});
  const last=pays.sort((a,b)=>a.date<b.date?1:-1)[0];
  return{out,b,oldest:open.length?daysSince(open[0].date):0,last};
}
function creditSummary(){let total=0,od=0,parties=0,odParties=0;const b=[0,0,0,0];const list=DB.customers.map(c=>{const x=creditOf(c);if(x.out>0){total+=x.out;parties++;x.b.forEach((v,i)=>b[i]+=v);if(x.b[2]+x.b[3]>0){od+=x.b[2]+x.b[3];odParties++}}return{c,x}});
  const collected=DB.payments.filter(p=>inMonth(p.date)).reduce((a,p)=>a+p.amount,0)+DB.sales.filter(s=>inMonth(s.date)).reduce((a,s)=>a+Math.min(s.paid,s.total),0);
  return{total,od,parties,odParties,b,list,collected}}
function stats(){
  const sum=a=>a.reduce((x,s)=>x+s.total,0);const ts=DB.sales.filter(s=>s.date===todayISO);const ms=DB.sales.filter(s=>inMonth(s.date));
  const day=TODAY.getDate();const ls=DB.sales.filter(s=>inMonth(s.date,1)&&+s.date.slice(8)<=day);
  let cogs=0,taxable=0;ms.forEach(s=>{taxable+=s.taxable!=null?s.taxable:calcDoc(s).taxable;s.items.forEach(it=>{const p=P(it.pid);if(p)cogs+=it.boxes*p.sqftPerBox*p.cost})});
  const exp=DB.expenses.filter(e=>inMonth(e.date)).reduce((x,e)=>x+e.amount,0);
  return{today:sum(ts),todayN:ts.length,sqftToday:ts.reduce((x,s)=>x+calcDoc(s).sqft,0),month:sum(ms),monthN:ms.length,last:sum(ls),gp:taxable-cogs,exp,profit:taxable-cogs-exp,taxable};
}

VIEWS.stock=()=>{
  const ps=DB.products;let bx=0,sq=0,val=0;ps.forEach(p=>{const b=stockBoxes(p);bx+=b;sq+=b*p.sqftPerBox;val+=b*p.sqftPerBox*p.cost});
  const low=ps.filter(p=>stockState(p)).length;const cats=['All','Floor','Wall','Wood','Outdoor','Elevation'];
  return `${ph('Stock','Box-wise and sq ft-wise stock for the showroom and both godowns, batch by batch, so shades never get mixed.',`<button class="btn" data-act="stockIn" type="button">${ic('truck',18)}Stock in</button><button class="btn primary" data-act="addDesign" type="button">${ic('plus',18)}Add design</button>`)}
  <div class="strip"><div><small>Designs</small><b>${ps.length}</b></div><div><small>Boxes in stock</small><b>${fmtN(bx)}</b></div><div><small>Sq ft in stock</small><b>${fmtN(sq)}</b></div><div><small>Stock value (cost)</small><b>${inrS(val)}</b></div><div><small>Low / out</small><b class="warn">${low}</b></div></div>
  <div class="toolbar"><label class="search">${ic('search',18)}<input id="q-stock" placeholder="Search design, size, brand or batch" data-in="stockQ" value="${esc(S.stockQ)}" autocomplete="off"></label><button class="btn hide-m" data-act="calc" type="button">${ic('calc',18)}Box calculator</button></div>
  <div class="chips">${cats.map(c=>`<button class="chip ${S.stockCat===c?'on':''}" data-act="stockCat" data-v="${c}" type="button">${c}</button>`).join('')}<button class="chip ${S.stockLow?'on':''}" data-act="stockLow" type="button">${ic('alert',14,2)}Low / out</button></div>
  <div id="stock-list" class="pgrid">${stockList()}</div>`;
};
function stockList(){
  const q=S.stockQ.trim().toLowerCase();
  const list=DB.products.filter(p=>(S.stockCat==='All'||p.category===S.stockCat)&&(!S.stockLow||stockState(p))&&(!q||[p.name,p.brand,p.size,p.finish,...p.batches.map(b=>b.code)].join(' ').toLowerCase().includes(q)));
  if(!list.length)return`<div class="empty" style="grid-column:1/-1"><b>No designs match</b>Try another size or clear the filters.</div>`;
  return list.map(p=>{const b=stockBoxes(p),s=stockState(p),pct=Math.min(100,b/(p.min*3)*100),bt=p.batches.filter(x=>x.boxes>0);
    return`<button class="pcard" data-act="viewProduct" data-id="${p.id}" type="button">${sw(p)}<span class="pc-b"><span class="pc-t"><b class="t">${esc(p.name)}</b>${s==='out'?'<span class="pill bad">Out of stock</span>':s==='low'?'<span class="pill warn">Low</span>':`<span class="pill">${esc(p.category)}</span>`}</span><span class="meta t">${p.size} mm · ${esc(p.finish)} · ${esc(p.brand)}</span><span class="pc-n"><span><b>${fmtN(b)}</b> boxes</span><span><b>${fmtN(b*p.sqftPerBox)}</b> sq ft</span><span><b>₹${p.rate}</b>/sq ft</span></span><span class="bar ${s}"><i style="width:${pct}%"></i></span><span class="meta t">${bt.length} batch${bt.length===1?'':'es'} · ${[...new Set(bt.map(x=>x.godown))].join(', ')||'—'}</span></span></button>`}).join('');
}

function saleRow(s){const c=calcDoc(s),st=saleStatus(s);
  return`<div class="row" data-act="viewSale" data-id="${s.id}" role="button" tabindex="0"><span class="av">${initials(s.cust.name)}</span><span class="grow"><b class="t">${esc(s.cust.name)}</b><span class="meta t">${s.no} · ${rel(s.date)} · ${fmtN(c.sqft)} sq ft</span></span><span class="r-end"><b class="amt">${inr(s.total)}</b><span class="pill ${st==='Paid'?'good':st==='Part paid'?'warn':'bad'}">${st==='Paid'?'Paid':st==='Part paid'?'Due '+inrS(s.total-s.paid):'On credit'}</span></span></div>`}

function salesList(){const q=S.salesQ.trim().toLowerCase();const l=sortedSales().filter(s=>(S.salesF==='All'||saleStatus(s)===S.salesF)&&(!q||(s.cust.name+' '+s.cust.phone+' '+s.no).toLowerCase().includes(q))).slice(0,60);

VIEWS.quotes=()=>{

  <div class="chips">${['All','Sent','Accepted','Converted','Expired','Lost'].map(c=>`<button class="chip ${S.quoteF===c?'on':''}" data-act="quoteF" data-v="${c}" type="button">${c}<em>${c==='All'?qs.length:qs.filter(q=>qStatus(q)===c).length}</em></button>`).join('')}</div>
  <div class="card flush"><div class="rows">${list.map(q=>{const s=qStatus(q),c=calcDoc(q),left=q.validDays-daysSince(q.date);return`<div class="row" data-act="viewQuote" data-id="${q.id}" role="button" tabindex="0"><span class="av">${initials(q.cust.name)}</span><span class="grow"><b class="t">${esc(q.cust.name)}</b><span class="meta t">${q.no} · ${rel(q.date)} · ${q.items.length} tile${q.items.length>1?'s':''} · ${fmtN(c.sqft)} sq ft${s==='Sent'?` · ${left>0?left+' days left':'expires today'}`:''}</span></span><span class="r-end"><b class="amt">${inr(q.total)}</b><span class="pill ${pc[s]}">${s}</span></span></div>`}).join('')||'<div class="empty"><b>Nothing here</b>No quotations with this status.</div>'}</div></div>`;
};

VIEWS.credit=()=>{
  const cs=creditSummary(),list=cs.list.filter(r=>r.x.out>0).sort((a,b)=>b.x.out-a.x.out),tot=cs.b.reduce((a,v)=>a+v,0)||1;
  const AC=['var(--good)','var(--warn)','var(--clay)','var(--bad)'],AL=['0–30 days','31–60 days','61–90 days','90+ days'];
  return`${ph('Credit (Udhaar)','Who owes you, since when, and how close each party is to their credit limit. One tap sends a polite WhatsApp reminder.',`<button class="btn primary" data-act="receivePay" type="button">${ic('cash',18)}Receive payment</button>`)}
  <section class="kpis">${kpi('Total to collect',inrS(cs.total),`${cs.parties} parties`,'hero')}${kpi('Overdue 60+ days',inrS(cs.od),`${cs.odParties} parties need a call`)}${kpi('Collected this month',inrS(cs.collected),'counter + party payments')}${kpi('Over credit limit',String(list.filter(r=>r.x.out>r.c.limit).length),'stop further credit')}</section>
  <div class="card"><div class="card-h"><h3>How old is the money?</h3><span class="muted" style="font-size:12px">Oldest bills are settled first</span></div>
    <div class="age">${cs.b.map((v,i)=>v>0?`<i style="width:${v/tot*100}%;background:${AC[i]}" title="${AL[i]}: ${inr(v)}"></i>`:'').join('')}</div>
    <div class="age-l">${cs.b.map((v,i)=>`<div><small><span class="dot" style="background:${AC[i]}"></span>${AL[i]}</small><b>${inrS(v)}</b></div>`).join('')}</div></div>
  <div class="card flush"><div class="rows">${list.map(({c,x})=>{const u=Math.min(100,x.out/c.limit*100),over=x.out>c.limit;return`<div class="row" data-act="ledger" data-id="${c.id}" role="button" tabindex="0"><span class="av">${initials(c.name)}</span><span class="grow"><b class="t">${esc(c.name)}</b><span class="meta t">${esc(c.type)} · oldest due <b style="color:${x.oldest>60?'var(--bad)':'var(--ink)'}">${x.oldest} days</b>${x.last?` · last paid ${rel(x.last.date).toLowerCase()}`:''}</span></span><span class="util hide-m"><span class="bar ${over?'out':u>80?'low':''}"><i style="width:${u}%"></i></span><small>${Math.round(u)}% of ${inrS(c.limit)}</small></span><span class="r-end"><b class="amt">${inr(x.out)}</b>${over?'<span class="pill bad">Over limit</span>':x.oldest>60?'<span class="pill warn">Overdue</span>':'<span class="pill">On time</span>'}</span><span class="row-acts"><a class="icon-btn wa" href="${wa(c.phone,remindText(c,x))}" target="_blank" rel="noopener" aria-label="Send reminder">${ic('wa',18)}</a></span></div>`}).join('')||'<div class="empty"><b>No dues</b>Everyone has paid.</div>'}</div></div>`;
};
const remindText=(c,x)=>`Namaste ${c.name} ji,\nThis is a gentle reminder from ${DB.settings.shop}. Your outstanding balance is ${inr(x.out)}${x.oldest>30?` (oldest bill ${x.oldest} days)`:''}.\nPlease arrange the payment at the earliest. UPI / cheque accepted.\nThank you!`;

/* ---------------- layers (sheets) ---------------- */
function openSheet(o){const L=document.createElement('div');L.className='layer';if(o.id)L.dataset.id=o.id;
  L.innerHTML=`<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet ${o.cls||''}" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><span class="grab"></span><div class="sheet-h"><div style="min-width:0"><h3>${o.title}</h3>${o.sub?`<p>${o.sub}</p>`:''}</div><button class="icon-btn" data-act="closeSheet" type="button" aria-label="Close">${ic('x',18)}</button></div><div class="sheet-b">${o.body}</div>${o.foot?`<div class="sheet-f">${o.foot}</div>`:''}</div>`;
  $('#layers').appendChild(L);document.body.classList.add('locked');const f=L.querySelector('[autofocus]');if(f&&matchMedia('(min-width:721px)').matches)setTimeout(()=>f.focus(),60);return L}
function closeSheet(){const ls=$('#layers').children;if(ls.length)ls[ls.length-1].remove();if(!ls.length)document.body.classList.remove('locked')}
function closeAll(){$('#layers').innerHTML='';document.body.classList.remove('locked')}
const layer=id=>$(`#layers .layer[data-id="${id}"]`);
let tT;function toast(m,cls){const t=$('#toast');t.textContent=m;t.className='show '+(cls||'');clearTimeout(tT);tT=setTimeout(()=>t.className=cls||'',2600)}
const seg=(k,opts,cur)=>`<div class="chips" style="flex-wrap:wrap">${opts.map(o=>`<button type="button" class="chip ${cur===o?'on':''}" data-act="seg" data-k="${k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;

function productBody(p){const b=stockBoxes(p);return`<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px" class="pd-top">${sw(p,'xl')}<div class="dl" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><small>Size</small><b>${p.size} mm</b></div><div><small>Finish</small><b>${esc(p.finish)}</b></div><div><small>Per box</small><b>${p.pcsPerBox} pcs · ${p.sqftPerBox} sq ft</b></div><div><small>Selling rate</small><b>₹${p.rate}/sq ft</b></div><div><small>Rate per box</small><b>${inr(p.rate*p.sqftPerBox)}</b></div><div><small>Purchase cost</small><b>₹${p.cost}/sq ft</b></div></div></div>
  <div><div class="sec-h"><h4>Batch-wise stock</h4><span class="pill ${b?'acc':'bad'}">${b} boxes · ${fmtN(b*p.sqftPerBox)} sq ft</span></div>
  <div class="tbl-w"><table class="tbl"><thead><tr><th>Batch</th><th>Shade</th><th>Location</th><th class="n">Boxes</th><th class="n">Sq ft</th></tr></thead><tbody>${p.batches.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.shade)}</td><td>${esc(x.godown)}</td><td class="n">${x.boxes}</td><td class="n">${fmtN(x.boxes*p.sqftPerBox)}</td></tr>`).join('')}</tbody></table></div>
  <p class="meta" style="margin-top:8px">Reorder level ${p.min} boxes${p.damaged?` · ${p.damaged} boxes written off as damaged`:''}. Give one customer one batch to avoid shade complaints.</p></div>
  <div class="card" style="background:var(--surface-2);border-style:dashed"><h4>How many boxes?</h4><div class="frow" style="margin-top:10px"><label class="fld"><span>Area to cover (sq ft)</span><input inputmode="decimal" data-in="pdCalc" data-id="${p.id}" id="pd-area" placeholder="e.g. 450"></label><label class="fld"><span>Wastage %</span><input inputmode="decimal" data-in="pdCalc" data-id="${p.id}" id="pd-w" value="10"></label></div><div class="calc-out" id="pd-out">Enter the room area to see boxes, pieces and cost.</div></div>`}
function calcOut(p,area,w){if(!(area>0))return'Enter the room area to see boxes, pieces and cost.';const bx=Math.ceil(area*(1+w/100)/p.sqftPerBox);const avail=stockBoxes(p);
  return`<b>${bx} boxes</b> · ${bx*p.pcsPerBox} pcs · ${fmt1(bx*p.sqftPerBox)} sq ft · about <b style="font-size:16px">${inr(bx*p.sqftPerBox*p.rate*1.18)}</b> incl. GST<br><span class="${avail>=bx?'':'muted'}" style="color:${avail>=bx?'var(--good)':'var(--bad)'}">${avail>=bx?`In stock (${avail} boxes available)`:`Short by ${bx-avail} boxes. Only ${avail} in stock.`}</span>`}

/* ---------------- builder (quote + bill) ---------------- */
function newDraft(kind,preset){S.draft=Object.assign({kind,cust:{id:null,name:'',phone:''},items:[],discount:0,transport:0,paid:'',mode:'Cash',fromQuote:null,leadId:null},preset||{});closeAll();openBuilder()}
function mkItem(p,extra){const best=[...p.batches].sort((a,b)=>b.boxes-a.boxes)[0];return Object.assign({pid:p.id,room:ROOMS[p.category][0],area:'',wastage:10,boxes:'',rate:p.rate,batch:best?best.code:''},extra||{})}
function openBuilder(){const d=S.draft,q=d.kind==='quote';
  openSheet({id:'builder',cls:'wide full',title:q?'New quotation':'New bill',sub:q?'Enter each room’s area. Boxes are worked out with wastage.':'Pick the batch for each tile. Stock is cut when you save.',body:builderBody(),
   foot:`<div class="bt-sum"><small id="bt-meta">0 boxes</small><b id="bt-total">₹0</b></div><button class="btn" data-act="closeSheet" type="button">Cancel</button><button class="btn primary lg" data-act="saveDraft" type="button">${q?'Save quotation':'Save bill'}</button>`});updateTotals()}
function rerenderBuilder(){const L=layer('builder');if(!L)return;const sb=L.querySelector('.sheet-b'),y=sb.scrollTop;sb.innerHTML=builderBody();sb.scrollTop=y;updateTotals()}
function custInfo(){const d=S.draft;if(!d.cust.id)return d.cust.name.trim()?`<div class="note">New customer. ${d.kind==='sale'?'They will be added to your party list when you save.':''}</div>`:'';const c=Cu(d.cust.id),x=creditOf(c);
  return`<div class="note ${x.out>c.limit?'bad':x.oldest>60?'warn':'good'}">${esc(c.type)} · Outstanding <b>${inr(x.out)}</b> of ${inrS(c.limit)} limit${x.oldest>60?` · oldest bill ${x.oldest} days old`:''}</div>`}
function builderBody(){const d=S.draft,sale=d.kind==='sale';
  return`<div class="b-sec"><h4>Customer</h4><div class="frow"><label class="fld"><span>Name</span><input id="b-name" list="custlist" data-in="bName" value="${esc(d.cust.name)}" placeholder="Customer or party name" autocomplete="off" autofocus></label><label class="fld"><span>Mobile</span><input id="b-phone" inputmode="tel" data-in="bPhone" value="${esc(d.cust.phone)}" placeholder="10-digit mobile"></label></div>
   <datalist id="custlist">${DB.customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><div id="b-custinfo" style="margin-top:10px">${custInfo()}</div></div>
  <div class="b-sec"><div class="sec-h"><h4>Tiles</h4><button class="btn sm" data-act="pickProduct" type="button">${ic('plus',16)}Add tile</button></div>
   <div class="bitems">${d.items.length?d.items.map(itemCard).join(''):`<button class="empty card" data-act="pickProduct" type="button" style="border-style:dashed;cursor:pointer;width:100%;background:var(--surface-2)"><b>Add the first tile</b>Pick from stock. Enter the room area and the boxes are calculated for you.</button>`}</div></div>
  <div class="b-sec"><h4>Charges</h4><div class="frow"><label class="fld"><span>Discount %</span><input inputmode="decimal" data-in="bDisc" value="${d.discount||''}" placeholder="0"></label><label class="fld"><span>Transport & loading ₹</span><input inputmode="decimal" data-in="bTrans" value="${d.transport||''}" placeholder="0"></label></div></div>
  ${sale?`<div class="b-sec"><h4>Payment</h4><div class="frow"><label class="fld"><span>Received now ₹</span><input id="b-paid" inputmode="decimal" data-in="bPaid" value="${d.paid}" placeholder="Leave empty if paid in full"></label><div class="fld"><span>Mode</span>${seg('bMode',['Cash','UPI','Card','Cheque'],d.mode)}</div></div><div id="bt-due" class="note" style="margin-top:10px"></div></div>`:''}
  <div class="b-sum" id="bt-break"></div>`}
function itemCard(it,i){const p=P(it.pid),sale=S.draft.kind==='sale';
  return`<div class="bitem"><div class="bitem-h">${sw(p,'sm')}<div class="grow"><b class="t">${esc(p.name)}</b><small class="t">${p.size} mm · ${esc(p.finish)} · ${p.sqftPerBox} sq ft/box · ${stockBoxes(p)} boxes in stock</small></div><button class="icon-btn" data-act="rmItem" data-i="${i}" type="button" aria-label="Remove tile">${ic('x',16)}</button></div>
  <div class="bitem-g"><label class="fld room"><span>Room</span><input data-in="itRoom" data-i="${i}" value="${esc(it.room)}"></label><label class="fld"><span>Area sq ft</span><input inputmode="decimal" data-in="itArea" data-i="${i}" value="${it.area}" placeholder="—"></label><label class="fld"><span>Wastage %</span><input inputmode="decimal" data-in="itWaste" data-i="${i}" value="${it.wastage}"></label><label class="fld"><span>Boxes</span><input inputmode="numeric" id="it-bx-${i}" data-in="itBoxes" data-i="${i}" value="${it.boxes}" placeholder="0"></label><label class="fld"><span>Rate ₹/sq ft</span><input inputmode="decimal" data-in="itRate" data-i="${i}" value="${it.rate}"></label>
  ${sale?`<label class="fld batch"><span>Batch / shade</span><select data-ch="itBatch" data-i="${i}">${p.batches.map(b=>`<option value="${esc(b.code)}" ${b.code===it.batch?'selected':''} ${b.boxes?'':'disabled'}>${esc(b.code)} · shade ${esc(b.shade)} · ${b.boxes} boxes · ${esc(b.godown)}</option>`).join('')}</select></label>`:''}</div>
  <div class="bitem-f" id="it-line-${i}"></div><div class="note" id="it-warn-${i}"></div></div>`}
function updateLine(i){const it=S.draft.items[i],p=P(it.pid),b=num(it.boxes),sq=b*p.sqftPerBox;const el=$('#it-line-'+i);if(!el)return;
  el.innerHTML=`<span>${b} boxes = <b style="font-size:13px">${fmt1(sq)} sq ft</b> · ${b*p.pcsPerBox} pcs</span><b>${inr(sq*num(it.rate))}</b>`;
  const w=$('#it-warn-'+i);let msg='',cls='note';const tot=stockBoxes(p);
  if(S.draft.kind==='sale'&&b>0){const bt=p.batches.find(x=>x.code===it.batch);if(tot<b){msg=`Short by ${b-tot} boxes. Total stock is ${tot} boxes.`;cls+=' bad'}else if(bt&&bt.boxes<b){msg=`Only ${bt.boxes} boxes in batch ${bt.code}. The rest will come from another batch, and shades can differ.`;cls+=' warn'}}
  else if(b>0&&tot<b){msg=`Only ${tot} boxes in stock today. Confirm supply before promising delivery.`;cls+=' warn'}
  w.className=cls;w.textContent=msg}
function updateTotals(){const d=S.draft;if(!d)return;d.items.forEach((_,i)=>updateLine(i));const c=calcDoc({items:d.items.filter(i=>num(i.boxes)>0),discount:d.discount,transport:d.transport});
  const t=$('#bt-total');if(!t)return;t.textContent=inr(c.total);$('#bt-meta').textContent=`${fmtN(c.boxes)} boxes · ${fmtN(c.sqft)} sq ft · incl. GST`;
  $('#bt-break').innerHTML=`<div><span>Tiles (${fmtN(c.sqft)} sq ft)</span><span>${inr(c.sub)}</span></div>${c.disc?`<div><span>Discount ${num(d.discount)}%</span><span>− ${inr(c.disc)}</span></div>`:''}<div><span>CGST 9%</span><span>${inr(c.gst/2)}</span></div><div><span>SGST 9%</span><span>${inr(c.gst/2)}</span></div>${c.transport?`<div><span>Transport & loading</span><span>${inr(c.transport)}</span></div>`:''}<div class="g"><span>Total</span><span>${inr(c.total)}</span></div>`;
  const due=$('#bt-due');if(due){const paid=d.paid===''?c.total:num(d.paid);const bal=c.total-paid;let m='',cls='note';
    if(bal>0){m=`Balance ${inr(bal)} goes to ${esc(d.cust.name||'this customer')}’s credit.`;cls+=' warn';if(d.cust.id){const cu=Cu(d.cust.id),x=creditOf(cu);if(x.out+bal>cu.limit){m+=` This takes them to ${inr(x.out+bal)}, over their ${inrS(cu.limit)} limit.`;cls='note bad'}}}
    else if(c.total>0){m='Paid in full.';cls+=' good'}due.className=cls;due.innerHTML=m}}

/* ---------------- documents ---------------- */
function paper(kind,doc,opt){const c=calcDoc(doc),s=DB.settings,inv=kind==='TAX INVOICE';
  return`<div class="paper"><div class="paper-h"><div><span class="shop">${esc(s.shop)}</span><small>${esc(s.city)} · GSTIN ${esc(s.gstin)} · ${esc(s.phone)}</small></div><div class="doc-tag"><span>${kind}</span><b>${doc.no}</b><small>${fdateY(doc.date)}${!inv?` · valid ${doc.validDays} days`:''}</small></div></div>
  <div><small>${inv?'Billed to':'Prepared for'}</small><b>${esc(doc.cust.name)}</b><small>${esc(doc.cust.phone||'')}</small></div>
  <div class="ptable-w"><table class="ptable"><thead><tr><th>Tile</th>${inv?'':'<th class="n">Area</th>'}<th class="n">Boxes</th><th class="n">Sq ft</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>${doc.items.map((it,i)=>{const l=c.lines[i];return`<tr><td><b>${esc(l.p.name)}</b><small>${l.p.size} mm · ${esc(it.room||'')}${inv&&it.batch?` · batch ${esc(it.batch)}`:''}</small></td>${inv?'':`<td class="n">${it.area?fmtN(it.area)+' + '+it.wastage+'%':'—'}</td>`}<td class="n">${it.boxes}</td><td class="n">${fmt1(l.sq)}</td><td class="n">₹${it.rate}</td><td class="n">${inr(l.amt)}</td></tr>`}).join('')}</tbody></table></div>
  <div class="ptot"><div><span>Sub-total</span><span>${inr(c.sub)}</span></div>${c.disc?`<div><span>Discount ${doc.discount}%</span><span>− ${inr(c.disc)}</span></div>`:''}<div><span>CGST 9%</span><span>${inr(c.gst/2)}</span></div><div><span>SGST 9%</span><span>${inr(c.gst/2)}</span></div>${c.transport?`<div><span>Transport & loading</span><span>${inr(c.transport)}</span></div>`:''}<div class="g"><span>Total</span><span>${inr(c.total)}</span></div>${inv?`<div><span>Received (${esc(doc.mode)})</span><span>${inr(doc.paid)}</span></div>${doc.total-doc.paid>0?`<div class="due"><span>Balance due</span><span>${inr(doc.total-doc.paid)}</span></div>`:''}`:''}</div>
  <ol class="terms">${(inv?['Goods once sold are taken back only in sealed boxes within 7 days.','Please check boxes at delivery. Breakage claims after unloading are not accepted.','Shade and batch as printed above.']:['Rates are per sq ft. GST 18% shown separately.','Boxes include the wastage % shown against each room.','Shade and batch subject to stock at billing. Confirm early to get one batch for the whole job.','Transport and loading as mentioned. Breakage after delivery is not covered.']).map(t=>`<li>${t}</li>`).join('')}</ol></div>`}
function quoteText(q){const c=calcDoc(q);return`Namaste ${q.cust.name} ji,\nQuotation ${q.no} from ${DB.settings.shop}:\n\n${q.items.map(it=>{const p=P(it.pid);return`• ${p.name} ${p.size} (${it.room}): ${it.boxes} boxes, ${fmt1(it.boxes*p.sqftPerBox)} sq ft @ ₹${it.rate}`}).join('\n')}\n\nTotal incl. GST: ${inr(c.total)}\nValid for ${q.validDays} days. Reply YES to book stock from a single batch.`}
function saleText(s){const due=s.total-s.paid;return`Namaste ${s.cust.name} ji,\nThank you for shopping at ${DB.settings.shop}.\nBill ${s.no} · ${fdateY(s.date)}\nAmount: ${inr(s.total)}\nPaid: ${inr(s.paid)}${due>0?`\nBalance: ${inr(due)}`:''}\n\nPlease keep a few spare boxes from the same batch for future repairs.`}

/* ---------------- actions ---------------- */
const A={};
A.nav=d=>{if(d.low)S.stockLow=true;closeAll();go(d.v)};
A.closeSheet=()=>closeSheet();
A.theme=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('tiledesk-theme',r.dataset.theme)}catch(e){}themeIcon()};
A.quick=()=>{const t=(act,icon,label,sub,cls)=>`<button data-act="${act}" type="button"><span class="qi ${cls||''}">${ic(icon,22)}</span><span><b>${label}</b><br><small>${sub}</small></span></button>`;
  openSheet({title:'Create',sub:'What would you like to do?',cls:'wide',body:`<div class="qa">${t('newSale','sales','New bill','GST bill, cuts stock')}${t('newQuote','quote','New quotation','Area to boxes in a minute')}${t('receivePay','cash','Receive payment','Against party credit','clay')}${t('addExpense','expense','Add expense','Hamali, transport, more','clay')}${t('addLead','leads','Add lead','New enquiry')}${t('stockIn','truck','Stock in','New batch arrived')}${t('calc','calc','Box calculator','Sq ft to boxes')}${t('addDesign','stock','Add design','New tile to catalogue')}</div>`})};
A.newSale=()=>newDraft('sale');A.newQuote=()=>newDraft('quote');
A.stockCat=d=>{S.stockCat=d.v;render()};A.stockLow=()=>{S.stockLow=!S.stockLow;render()};
A.salesF=d=>{S.salesF=d.v;render()};A.quoteF=d=>{S.quoteF=d.v;render()};A.expF=d=>{S.expF=d.v;render()};
A.seg=(d,el)=>{S.form[d.k]=d.v;el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));if(d.k==='bMode'&&S.draft)S.draft.mode=d.v};
A.viewProduct=d=>{const p=P(d.id);openSheet({cls:'wide',title:esc(p.name),sub:`${esc(p.brand)} · ${esc(p.category)} tile`,body:productBody(p),foot:`<button class="btn" data-act="damage" data-id="${p.id}" type="button">${ic('broken',18)}Damaged</button><button class="btn" data-act="stockIn" data-id="${p.id}" type="button">${ic('truck',18)}Stock in</button><button class="btn primary" data-act="quoteWith" data-id="${p.id}" type="button">Quote this tile</button>`})};
A.quoteWith=d=>{const p=P(d.id);newDraft('quote',{items:[mkItem(p)]})};
A.calc=()=>{openSheet({title:'Box calculator',sub:'Customer tells you the area, you tell them the boxes.',body:`<label class="fld"><span>Tile</span><select id="calc-p" data-ch="calcP">${DB.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.size} · ${p.sqftPerBox} sq ft/box</option>`).join('')}</select></label><div class="frow"><label class="fld"><span>Area (sq ft)</span><input id="calc-a" inputmode="decimal" data-in="calcRun" placeholder="e.g. 450" autofocus></label><label class="fld"><span>Wastage %</span><input id="calc-w" inputmode="decimal" data-in="calcRun" value="10"></label></div><div class="note" style="font-size:12px">Tip: 10% wastage for straight laying, 15% for diagonal or large-format tiles.</div><div class="calc-out" id="calc-out">Enter the room area to see boxes, pieces and cost.</div>`})};
A.pickProduct=()=>{openSheet({id:'picker',title:'Add tile',sub:'Search by name, size or finish',body:`<label class="search" style="flex:none">${ic('search',18)}<input data-in="pickQ" placeholder="e.g. 600×1200, wood, glossy" autofocus autocomplete="off"></label><div id="pick-list" style="display:flex;flex-direction:column;gap:2px">${pickList('')}</div>`})};
function pickList(q){q=q.toLowerCase();return DB.products.filter(p=>!q||[p.name,p.size,p.finish,p.category,p.brand].join(' ').toLowerCase().includes(q)).map(p=>{const b=stockBoxes(p);return`<button class="pick" data-act="pickAdd" data-id="${p.id}" type="button">${sw(p,'sm')}<span class="grow"><b class="t">${esc(p.name)}</b><span class="meta t">${p.size} · ${esc(p.finish)} · ₹${p.rate}/sq ft</span></span><span class="pill ${b?b<=p.min?'warn':'good':'bad'}">${b} boxes</span></button>`}).join('')}
A.pickAdd=d=>{const p=P(d.id);S.draft.items.push(mkItem(p));closeSheet();rerenderBuilder();setTimeout(()=>{const L=layer('builder');const ins=L&&L.querySelectorAll('[data-in="itArea"]');if(ins&&ins.length){ins[ins.length-1].scrollIntoView({block:'center',behavior:'smooth'})}},30)};
A.rmItem=d=>{S.draft.items.splice(+d.i,1);rerenderBuilder()};
A.saveDraft=()=>{const d=S.draft;if(!d.cust.name.trim())return toast('Add the customer name first','bad');if(!d.items.length)return toast('Add at least one tile','bad');
  if(d.items.some(i=>!(num(i.boxes)>0)))return toast('Every tile needs a box quantity','bad');
  const items=d.items.map(i=>({pid:i.pid,room:i.room,area:num(i.area)||'',wastage:num(i.wastage),boxes:Math.round(num(i.boxes)),rate:num(i.rate),batch:i.batch}));const c=calcDoc({items,discount:d.discount,transport:d.transport});
  if(d.kind==='quote'){const no='QT-'+(DB.seq.q++);const q={id:uid('q'),no,date:todayISO,cust:{id:d.cust.id,name:d.cust.name.trim(),phone:d.cust.phone},items,discount:num(d.discount),transport:num(d.transport),status:'Sent',validDays:15,total:c.total};
    DB.quotes.unshift(q);if(d.leadId){const l=DB.leads.find(x=>x.id===d.leadId);if(l)l.stage='Quoted'}save();closeAll();S.quoteF='All';go('quotes');toast(`Quotation ${no} saved`);A.viewQuote({id:q.id});return}
  for(const it of items){const p=P(it.pid);if(stockBoxes(p)<it.boxes)return toast(`Not enough stock for ${p.name}`,'bad')}
  const paid=d.paid===''?c.total:Math.min(c.total,num(d.paid));let cid=d.cust.id;
  if(!cid){const m=DB.customers.find(x=>x.name.toLowerCase()===d.cust.name.trim().toLowerCase()||(d.cust.phone&&x.phone===d.cust.phone));if(m)cid=m.id;else if(paid<c.total){const nc={id:uid('c'),name:d.cust.name.trim(),type:'Retail',phone:d.cust.phone,limit:50000,opening:0,openingDate:null};DB.customers.push(nc);cid=nc.id}}
  items.forEach(it=>{const p=P(it.pid);const b0=p.batches.find(b=>b.code===it.batch);it.shade=b0?b0.shade:'';let need=it.boxes;const order=[...p.batches].sort((a,b)=>a.code===it.batch?-1:b.code===it.batch?1:b.boxes-a.boxes);for(const b of order){const t=Math.min(b.boxes,need);b.boxes-=t;need-=t;if(!need)break}});
  const no=DB.seq.s++;const s={id:uid('s'),no:'INV-'+no,date:todayISO,cust:{id:cid,name:d.cust.name.trim(),phone:d.cust.phone},items,discount:num(d.discount),transport:num(d.transport),paid,mode:paid===0?'Credit':d.mode,total:c.total,taxable:c.taxable};
  DB.sales.push(s);if(d.fromQuote){const q=DB.quotes.find(x=>x.id===d.fromQuote);if(q)q.status='Converted'}save();closeAll();S.salesF='All';go('sales');toast(`Bill ${s.no} saved · stock updated`);A.viewSale({id:s.id})};
A.viewQuote=d=>{const q=DB.quotes.find(x=>x.id===d.id),st=qStatus(q),open=['Sent','Accepted','Expired'].includes(st);
  openSheet({cls:'wide',title:`${q.no} <span class="pill ${st==='Converted'||st==='Accepted'?'good':st==='Sent'?'acc':st==='Lost'?'bad':'warn'}" style="vertical-align:middle">${st}</span>`,sub:`${esc(q.cust.name)} · ${fdateY(q.date)}`,body:paper('QUOTATION',q),
   foot:`${open?`<button class="btn" data-act="qLost" data-id="${q.id}" type="button">Mark lost</button>`:''}<a class="btn wa" href="${wa(q.cust.phone,quoteText(q))}" target="_blank" rel="noopener">${ic('wa',18)}Send on WhatsApp</a>${open?`<button class="btn primary" data-act="convertQuote" data-id="${q.id}" type="button">Convert to bill</button>`:''}`})};
A.qLost=d=>{const q=DB.quotes.find(x=>x.id===d.id);q.status='Lost';save();closeAll();render();toast(`${q.no} marked lost`)};
A.convertQuote=d=>{const q=DB.quotes.find(x=>x.id===d.id);const m=DB.customers.find(x=>x.name.toLowerCase()===q.cust.name.toLowerCase());
  newDraft('sale',{cust:{id:m?m.id:null,name:q.cust.name,phone:q.cust.phone},items:q.items.map(i=>mkItem(P(i.pid),{room:i.room,area:i.area,wastage:i.wastage,boxes:i.boxes,rate:i.rate})),discount:q.discount,transport:q.transport,fromQuote:q.id})};
A.viewSale=d=>{const s=DB.sales.find(x=>x.id===d.id),due=s.total-s.paid;
  openSheet({cls:'wide',title:s.no,sub:`${esc(s.cust.name)} · ${fdateY(s.date)}`,body:paper('TAX INVOICE',s),foot:`${due>0&&s.cust.id?`<button class="btn" data-act="receivePay" data-cid="${s.cust.id}" type="button">${ic('cash',18)}Receive payment</button>`:''}<a class="btn wa" href="${wa(s.cust.phone,saleText(s))}" target="_blank" rel="noopener">${ic('wa',18)}Send bill on WhatsApp</a>`})};
A.ledger=d=>{const c=Cu(d.id),x=creditOf(c);const e=[];if(c.opening)e.push({date:c.openingDate,t:'Opening balance',dr:c.opening,cr:0});
  DB.sales.filter(s=>s.cust.id===c.id).forEach(s=>{e.push({date:s.date,t:`Bill ${s.no}`,dr:s.total,cr:0});if(s.paid)e.push({date:s.date,t:`Paid at counter (${s.mode})`,dr:0,cr:s.paid})});
  DB.payments.filter(p=>p.cid===c.id).forEach(p=>e.push({date:p.date,t:`Payment · ${p.mode}${p.note?' · '+esc(p.note):''}`,dr:0,cr:p.amount}));e.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:b.dr-a.dr);let bal=0;e.forEach(r=>{bal+=r.dr-r.cr;r.bal=bal});
  openSheet({cls:'wide',title:esc(c.name),sub:`${esc(c.type)} · ${esc(c.phone)} · credit limit ${inr(c.limit)}`,body:`<div class="strip"><div><small>Outstanding</small><b class="${x.out>c.limit?'bad':''}">${inr(x.out)}</b></div><div><small>Oldest due</small><b class="${x.oldest>60?'bad':''}">${x.oldest} days</b></div><div><small>Last payment</small><b>${x.last?inrS(x.last.amount)+' · '+fdate(x.last.date):'—'}</b></div></div>
   <div class="tbl-w"><table class="tbl"><thead><tr><th>Date</th><th>Details</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr></thead><tbody>${e.slice().reverse().map(r=>`<tr><td style="white-space:nowrap">${fdate(r.date)}</td><td>${r.t}</td><td class="n">${r.dr?inr(r.dr):''}</td><td class="n" style="color:var(--good)">${r.cr?inr(r.cr):''}</td><td class="n"><b>${inr(r.bal)}</b></td></tr>`).join('')}</tbody></table></div>`,
   foot:`<a class="btn wa" href="${wa(c.phone,remindText(c,x))}" target="_blank" rel="noopener">${ic('wa',18)}Send reminder</a><button class="btn primary" data-act="receivePay" data-cid="${c.id}" type="button">${ic('cash',18)}Receive payment</button>`})};
A.receivePay=d=>{S.form={payMode:'UPI'};const list=creditSummary().list.filter(r=>r.x.out>0).sort((a,b)=>b.x.out-a.x.out);const cid=d.cid||(list[0]&&list[0].c.id);
  openSheet({id:'pay',title:'Receive payment',sub:'Settles the oldest bills first',body:`<label class="fld"><span>Party</span><select id="pay-c" data-ch="payC">${list.map(r=>`<option value="${r.c.id}" ${r.c.id===cid?'selected':''}>${esc(r.c.name)} · due ${inr(r.x.out)}</option>`).join('')}</select></label><div class="frow"><label class="fld"><span>Amount ₹</span><input id="pay-amt" inputmode="decimal" placeholder="0" autofocus></label><label class="fld"><span>Date</span><input id="pay-date" type="date" value="${todayISO}"></label></div><div class="fld"><span>Mode</span>${seg('payMode',['UPI','Cash','Cheque','NEFT'],'UPI')}</div><label class="fld"><span>Note (optional)</span><input id="pay-note" placeholder="Cheque no., site name…"></label><div id="pay-info" class="note"></div>`,
   foot:`<button class="btn" data-act="closeSheet" type="button">Cancel</button><button class="btn primary lg" data-act="savePay" type="button">Save payment</button>`});payInfo()};
function payInfo(){const el=$('#pay-c');if(!el)return;const c=Cu(el.value);if(!c)return;const x=creditOf(c);$('#pay-info').innerHTML=`Outstanding <b>${inr(x.out)}</b> · oldest bill ${x.oldest} days · limit ${inrS(c.limit)}`;$('#pay-amt').placeholder=String(Math.round(x.out))}
A.savePay=()=>{const cid=$('#pay-c').value,amt=num($('#pay-amt').value);if(!(amt>0))return toast('Enter the amount received','bad');const c=Cu(cid);
  DB.payments.push({id:uid('pay'),cid,date:$('#pay-date').value||todayISO,amount:amt,mode:S.form.payMode||'UPI',note:$('#pay-note').value.trim()});save();closeAll();render();toast(`${inr(amt)} received from ${c.name}`)};
A.addExpense=()=>{S.form={expCat:'Transport',expMode:'Cash'};openSheet({title:'Add expense',sub:'Takes five seconds. Do it right when you pay.',body:`<div class="frow"><label class="fld"><span>Amount ₹</span><input id="e-amt" inputmode="decimal" placeholder="0" autofocus></label><label class="fld"><span>Date</span><input id="e-date" type="date" value="${todayISO}"></label></div><div class="fld"><span>Category</span>${seg('expCat',EXP_CATS,'Transport')}</div><label class="fld"><span>Details</span><input id="e-note" placeholder="e.g. Tempo to Bopal site"></label><div class="fld"><span>Paid by</span>${seg('expMode',['Cash','UPI','NEFT'],'Cash')}</div>`,foot:`<button class="btn" data-act="closeSheet" type="button">Cancel</button><button class="btn primary lg" data-act="saveExpense" type="button">Save expense</button>`})};
A.saveExpense=()=>{const amt=num($('#e-amt').value);if(!(amt>0))return toast('Enter the amount','bad');DB.expenses.push({id:uid('e'),date:$('#e-date').value||todayISO,cat:S.form.expCat,amount:amt,note:$('#e-note').value.trim(),mode:S.form.expMode});save();closeAll();render();toast(`Expense of ${inr(amt)} added`)};
A.addLead=()=>{S.form={leadSrc:'Walk-in'};openSheet({title:'Add lead',sub:'Capture every enquiry, even if they are “just looking”.',body:`<div class="frow"><label class="fld"><span>Name</span><input id="l-name" autofocus></label><label class="fld"><span>Mobile</span><input id="l-phone" inputmode="tel"></label></div><label class="fld"><span>Requirement</span><input id="l-need" placeholder="e.g. 2BHK flooring, glossy 600×1200"></label><div class="frow"><label class="fld"><span>Approx. area (sq ft)</span><input id="l-area" inputmode="decimal"></label><label class="fld"><span>Follow up on</span><input id="l-follow" type="date" value="${dAgo(-1)}"></label></div><div class="fld"><span>Source</span>${seg('leadSrc',['Walk-in','Architect','Contractor','Instagram','IndiaMART','Google','Referral'],'Walk-in')}</div>`,foot:`<button class="btn" data-act="closeSheet" type="button">Cancel</button><button class="btn primary lg" data-act="saveLead" type="button">Save lead</button>`})};
A.saveLead=()=>{const name=$('#l-name').value.trim();if(!name)return toast('Add the name','bad');const area=num($('#l-area').value);DB.leads.unshift({id:uid('l'),name,phone:$('#l-phone').value.trim(),need:$('#l-need').value.trim()||'Tile requirement',area,value:Math.round(area*72/1000)*1000,source:S.form.leadSrc,stage:'New',follow:$('#l-follow').value||null,created:todayISO,note:''});save();closeAll();go('leads');toast(`Lead ${name} added`)};
A.viewLead=d=>{const l=DB.leads.find(x=>x.id===d.id);openSheet({id:'lead',title:esc(l.name),sub:`${esc(l.source)} · added ${rel(l.created).toLowerCase()}`,body:`<div class="note" style="font-size:14px;color:var(--ink)">${esc(l.need)}</div><div class="dl"><div><small>Area</small><b>${fmtN(l.area)} sq ft</b></div><div><small>Likely value</small><b>${inr(l.value)}</b></div><div><small>Mobile</small><b>${esc(l.phone)}</b></div></div>
  <div class="fld"><span>Stage</span><div class="chips" style="flex-wrap:wrap">${STAGES.map(s=>`<button type="button" class="chip ${l.stage===s?'on':''}" data-act="leadStage" data-id="${l.id}" data-v="${s}"><span class="dot" style="background:${STAGE_C[s]}"></span>${s}</button>`).join('')}</div></div>
  <label class="fld"><span>Next follow-up</span><input type="date" value="${l.follow||''}" data-ch="leadFollow" data-id="${l.id}"></label><label class="fld"><span>Notes</span><textarea data-ch="leadNote" data-id="${l.id}" placeholder="Budget, preferred finish, site visit details…">${esc(l.note)}</textarea></label>`,
  foot:`<a class="btn wa" href="${wa(l.phone,`Namaste ${l.name} ji, this is ${DB.settings.shop}. Following up on your tile requirement.`)}" target="_blank" rel="noopener">${ic('wa',18)}WhatsApp</a><button class="btn primary" data-act="leadQuote" data-id="${l.id}" type="button">Make quotation</button>`})};
A.leadStage=(d,el)=>{const l=DB.leads.find(x=>x.id===d.id);l.stage=d.v;save();el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));render();toast(`${l.name} moved to ${d.v}`)};
A.leadQuote=d=>{const l=DB.leads.find(x=>x.id===d.id);newDraft('quote',{cust:{id:null,name:l.name,phone:l.phone},leadId:l.id})};
A.stockIn=d=>{const p0=d.id?P(d.id):DB.products[0];openSheet({id:'stockin',title:'Stock in',sub:'Record a new batch from the supplier or add to an existing one',body:`<label class="fld"><span>Design</span><select id="si-p" data-ch="siP">${DB.products.map(p=>`<option value="${p.id}" ${p.id===p0.id?'selected':''}>${esc(p.name)} · ${p.size}</option>`).join('')}</select></label><div class="frow"><label class="fld"><span>Batch no.</span><input id="si-b" list="si-bl" placeholder="e.g. VM-2411A"></label><label class="fld"><span>Shade</span><input id="si-s" placeholder="e.g. S2"></label></div><datalist id="si-bl">${p0.batches.map(b=>`<option value="${esc(b.code)}">`).join('')}</datalist><div class="frow"><label class="fld"><span>Boxes received</span><input id="si-n" inputmode="numeric" placeholder="0" autofocus></label><label class="fld"><span>Location</span><select id="si-g">${GODOWNS.map(g=>`<option>${g}</option>`).join('')}</select></label></div><div class="note">Same batch number adds to that batch. A new number creates a new batch, so shades stay separate.</div>`,foot:`<button class="btn" data-act="closeSheet" type="button">Cancel</button><button class="btn primary lg" data-act="saveStockIn" type="button">Add to stock</button>`})};
A.saveStockIn=()=>{const p=P($('#si-p').value),code=$('#si-b').value.trim()||('NEW-'+todayISO.slice(2,7).replace('-','')),n=Math.round(num($('#si-n').value));if(!(n>0))return toast('Enter boxes received','bad');
  const b=p.batches.find(x=>x.code.toLowerCase()===code.toLowerCase());if(b){b.boxes+=n}else p.batches.push({code,shade:$('#si-s').value.trim()||'—',boxes:n,godown:$('#si-g').value});save();closeAll();render();toast(`${n} boxes of ${p.name} added`)};
A.damage=d=>{const p=P(d.id);openSheet({id:'dmg',title:'Write off damaged boxes',sub:esc(p.name)+' · loss is added to Breakage expenses',body:`<label class="fld"><span>Batch</span><select id="dm-b">${p.batches.filter(b=>b.boxes).map(b=>`<option value="${esc(b.code)}">${esc(b.code)} · ${b.boxes} boxes · ${esc(b.godown)}</option>`).join('')}</select></label><div class="frow"><label class="fld"><span>Damaged boxes</span><input id="dm-n" inputmode="numeric" autofocus></label><label class="fld"><span>Reason</span><select id="dm-r"><option>Broken in transit</option><option>Damaged at unloading</option><option>Chipped / edge damage</option><option>Showroom display</option></select></label></div>`,foot:`<button class="btn" data-act="closeSheet" type="button">Cancel</button><button class="btn primary lg" data-act="saveDamage" data-id="${p.id}" type="button">Write off</button>`})};
A.saveDamage=d=>{const p=P(d.id),b=p.batches.find(x=>x.code===$('#dm-b').value),n=Math.round(num($('#dm-n').value));if(!b||!(n>0))return toast('Enter the damaged boxes','bad');const k=Math.min(n,b.boxes);b.boxes-=k;p.damaged+=k;
  DB.expenses.push({id:uid('e'),date:todayISO,cat:'Breakage',amount:Math.round(k*p.sqftPerBox*p.cost),note:`${$('#dm-r').value}: ${k} boxes ${p.name}`,mode:'—'});save();closeAll();render();toast(`${k} boxes written off · ${inr(k*p.sqftPerBox*p.cost)} loss recorded`)};
A.addDesign=()=>{S.form={adCat:'Floor',adPat:'marble'};openSheet({id:'design',cls:'wide',title:'Add design',sub:'Add a new tile to the catalogue with its opening stock',body:`<div class="frow"><label class="fld"><span>Design name</span><input id="ad-n" placeholder="e.g. Carrara Silk" autofocus></label><label class="fld"><span>Brand</span><input id="ad-b" placeholder="e.g. Vitro Max"></label></div><div class="fld"><span>Category</span>${seg('adCat',['Floor','Wall','Wood','Outdoor','Elevation'],'Floor')}</div><div class="frow3"><label class="fld"><span>Size (mm)</span><input id="ad-s" value="600×1200"></label><label class="fld"><span>Finish</span><input id="ad-f" value="Glossy"></label><label class="fld"><span>Pcs per box</span><input id="ad-pc" inputmode="numeric" value="2"></label><label class="fld"><span>Sq ft per box</span><input id="ad-sq" inputmode="decimal" value="15.5"></label><label class="fld"><span>Sell ₹/sq ft</span><input id="ad-r" inputmode="decimal" value="80"></label><label class="fld"><span>Cost ₹/sq ft</span><input id="ad-c" inputmode="decimal" value="58"></label><label class="fld"><span>Opening boxes</span><input id="ad-o" inputmode="numeric" value="50"></label><label class="fld"><span>Batch no.</span><input id="ad-bt" placeholder="e.g. VM-2411"></label><label class="fld"><span>Reorder at (boxes)</span><input id="ad-m" inputmode="numeric" value="30"></label></div><div class="fld"><span>Look</span>${seg('adPat',['marble','stone','wood','solid','pattern','linear','cobble','slate'],'marble')}</div><div class="frow"><label class="fld"><span>Base colour</span><input id="ad-c1" type="color" value="#EFEAE2" style="padding:4px"></label><label class="fld"><span>Vein / accent colour</span><input id="ad-c2" type="color" value="#9C8F7E" style="padding:4px"></label></div>`,foot:`<button class="btn" data-act="closeSheet" type="button">Cancel</button><button class="btn primary lg" data-act="saveDesign" type="button">Save design</button>`})};
A.saveDesign=()=>{const name=$('#ad-n').value.trim();if(!name)return toast('Add the design name','bad');const id='p'+Date.now().toString(36);const g=k=>$('#ad-'+k).value;
  DB.products.unshift({id,name,brand:g('b')||'—',category:S.form.adCat,size:g('s'),finish:g('f'),sqftPerBox:num(g('sq'))||15.5,pcsPerBox:num(g('pc'))||2,rate:num(g('r')),cost:num(g('c')),pattern:S.form.adPat,c1:g('c1'),c2:g('c2'),min:num(g('m'))||20,batches:[{code:g('bt')||'OPEN',shade:'—',boxes:Math.round(num(g('o'))),godown:'Showroom'}],damaged:0});save();closeAll();S.stockCat='All';S.stockQ='';S.stockLow=false;go('stock');toast(`${name} added to stock`)};
A.reset=(d,el)=>{if(!el.classList.contains('armed')){el.classList.add('armed');el.textContent='Tap again to erase and reload sample data';setTimeout(()=>{if(el.isConnected){el.classList.remove('armed');el.textContent='Reset demo data'}},4000);return}
  DB=seed();save();closeAll();go('home');toast('Fresh demo data loaded')};

/* inputs */
const IN={};
IN.stockQ=el=>{S.stockQ=el.value;$('#stock-list').innerHTML=stockList()};
IN.salesQ=el=>{S.salesQ=el.value;$('#sales-list').innerHTML=salesList()};
IN.pickQ=el=>{$('#pick-list').innerHTML=pickList(el.value)};
IN.pdCalc=el=>{const p=P(el.dataset.id);$('#pd-out').innerHTML=calcOut(p,num($('#pd-area').value),num($('#pd-w').value))};
IN.calcRun=()=>{const p=P($('#calc-p').value);$('#calc-out').innerHTML=calcOut(p,num($('#calc-a').value),num($('#calc-w').value))};
IN.bName=el=>{const d=S.draft,v=el.value;d.cust.name=v;const m=DB.customers.find(c=>c.name.toLowerCase()===v.trim().toLowerCase());if(m){d.cust.id=m.id;d.cust.phone=m.phone;$('#b-phone').value=m.phone}else d.cust.id=null;$('#b-custinfo').innerHTML=custInfo();updateTotals()};
IN.bPhone=el=>{S.draft.cust.phone=el.value};
IN.bDisc=el=>{S.draft.discount=el.value;updateTotals()};
IN.bTrans=el=>{S.draft.transport=el.value;updateTotals()};
IN.bPaid=el=>{S.draft.paid=el.value;updateTotals()};
const itm=el=>S.draft.items[+el.dataset.i];
const autoBoxes=(el)=>{const i=+el.dataset.i,it=S.draft.items[i],p=P(it.pid);if(num(it.area)>0){it.boxes=Math.ceil(num(it.area)*(1+num(it.wastage)/100)/p.sqftPerBox);const b=$('#it-bx-'+i);if(b)b.value=it.boxes}};
IN.itRoom=el=>{itm(el).room=el.value};
IN.itArea=el=>{itm(el).area=el.value;autoBoxes(el);updateTotals()};
IN.itWaste=el=>{itm(el).wastage=el.value;autoBoxes(el);updateTotals()};
IN.itBoxes=el=>{itm(el).boxes=el.value;updateTotals()};
IN.itRate=el=>{itm(el).rate=el.value;updateTotals()};
const CH={};
CH.itBatch=el=>{itm(el).batch=el.value;updateTotals()};
CH.calcP=()=>IN.calcRun();
CH.payC=()=>payInfo();
CH.siP=el=>{const p=P(el.value);$('#si-bl').innerHTML=p.batches.map(b=>`<option value="${esc(b.code)}">`).join('')};
CH.leadFollow=el=>{const l=DB.leads.find(x=>x.id===el.dataset.id);l.follow=el.value||null;save();render()};
CH.leadNote=el=>{const l=DB.leads.find(x=>x.id===el.dataset.id);l.note=el.value;save()};

document.addEventListener('click',e=>{if(e.target.closest('a[href^="http"]'))return;const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el,e)}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layers').children.length){closeSheet();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('submit',e=>{if(e.target.id==='shop-form'){e.preventDefault();const s=DB.settings;['shop','owner','city','gstin','phone'].forEach(k=>s[k]=$('#s-'+k).value.trim()||s[k]);save();render();toast('Shop details saved')}});

function themeIcon(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;$('#theme-btn').innerHTML=ic(dark?'sun':'moon',18)}
try{const t=localStorage.getItem('tiledesk-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#top-gear').innerHTML=ic('gear',18);
load();themeIcon();render();
window.__tiledesk={go,A,S,get DB(){return DB}};
})();
</script>
